apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-ordering
  namespace: food-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: food-ordering
  template:
    metadata:
      labels:
        app: food-ordering
    spec:
      containers:
        - name: food-ordering
          image: demoacr1.azurecr.io/food-app:v1
          ports:
            - containerPort: 5000